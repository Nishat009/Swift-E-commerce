# Render's free plan puts the API to sleep after 15 minutes without traffic, and the first visitor
# then waits ~30 s while it wakes. Pinging the health check every 10 minutes keeps it awake.
# (One always-on free service fits in Render's 750 free hours a month.)
# Set the repository variable BACKEND_HEALTH_URL to point somewhere else.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        env:
          URL: ${{ vars.BACKEND_HEALTH_URL || 'https://swift-e-commerce.onrender.com/api/health' }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 60 "$URL"; then exit 0; fi
            sleep 10
          done
          echo "Health check did not answer" >&2
          exit 1
